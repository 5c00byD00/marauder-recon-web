name: CI

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: grep -q '/marauder-recon-web/assets/' dist/index.html
      - run: test -f dist/manifest.webmanifest
      - run: test -f dist/sw.js
      - run: grep -q 'marauder-recon-' dist/sw.js
